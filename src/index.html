<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TileForge — Visual App Builder</title>
<style>
:root{--blue:#0078d7;--deep:#005a9e;--ink:#222}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:#eee}header{height:56px;background:var(--blue);color:white;display:flex;align-items:center;padding:0 18px;gap:14px}.brand{font-size:22px;font-weight:300}.sub{font-size:13px;opacity:.85}.app{display:grid;grid-template-columns:190px minmax(280px,1fr) 230px;height:calc(100vh - 56px)}.panel{background:#fafafa;padding:14px;overflow:auto;border-right:1px solid #ddd}.right{border-right:0;border-left:1px solid #ddd}h2{font-weight:300;font-size:21px;margin:4px 0 14px}h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#555}.tool{display:flex;align-items:center;gap:10px;padding:12px 10px;margin:5px 0;background:white;border:1px solid #ddd;cursor:pointer}.tool:hover{border-color:var(--blue);background:#f1f8ff}.symbol{width:26px;text-align:center;color:var(--blue);font-size:20px}button{font:inherit;border:0;padding:9px 13px;background:var(--blue);color:white;cursor:pointer}button:hover{background:var(--deep)}button.secondary{background:white;color:#222;border:1px solid #ccc}.workspace{padding:20px;overflow:auto;background:#e6e6e6}.topbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}#canvas{position:relative;margin:auto;width:min(100%,850px);height:620px;background:white;box-shadow:0 2px 12px #0002;overflow:hidden}.element{position:absolute;min-width:40px;min-height:28px;padding:5px;cursor:move;outline:1px dashed transparent;z-index:1;white-space:pre-wrap;overflow-wrap:anywhere}.element.selected{outline:1px solid var(--blue);box-shadow:0 0 0 2px #0078d733}.element img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.element button{width:100%;height:100%;pointer-events:none}.field{margin:12px 0}.field label{display:block;font-size:13px;color:#555;margin-bottom:5px}input{width:100%;padding:8px;border:1px solid #bbb;background:white;font:inherit}.empty{font-size:13px;color:#777;line-height:1.5}.status{font-size:12px;color:#666;margin-top:14px}@media(max-width:800px){.app{grid-template-columns:135px 1fr;height:auto;min-height:calc(100vh - 56px)}.right{grid-column:1/-1;border-left:0}.workspace{padding:9px}.panel{padding:9px}#canvas{height:550px}.tool{font-size:13px;padding:8px 5px}}
</style></head><body>
<header><span class="brand">TileForge</span><span class="sub">Visual App Builder · prototype</span></header>
<div class="app"><aside class="panel"><h2>Toolbox</h2><h3>Components</h3>
<div class="tool" data-kind="text"><span class="symbol">T</span>Text</div><div class="tool" data-kind="button"><span class="symbol">▰</span>Button</div><div class="tool" data-kind="image"><span class="symbol">▧</span>Image</div><div class="tool" data-kind="tile"><span class="symbol">▦</span>Metro tile</div>
<h3>Project</h3><button class="secondary" id="addText" style="width:100%">+ Add text</button><p class="empty">Click a component to add it. Drag items to position them.</p></aside>
<main class="workspace"><div class="topbar"><button id="save">Save project</button><button id="open" class="secondary">Open project</button><button id="preview" class="secondary">Export HTML preview</button><button id="clear" class="secondary">Clear canvas</button><input id="fileOpen" type="file" accept=".tileforge,.json" hidden></div><div id="canvas" aria-label="Design canvas"></div><p class="status" id="status">Ready · select a component to edit its properties.</p></main>
<aside class="panel right"><h2>Properties</h2><div id="inspector" class="empty">Select an item on the canvas to edit it.</div></aside></div><input id="imageFile" type="file" accept="image/*" hidden>
<script>
(()=>{'use strict';const canvas=document.querySelector('#canvas'),inspector=document.querySelector('#inspector'),status=document.querySelector('#status');let items=[],selected=null,nextId=1,drag=null;const defaults={text:{text:'Hello, world!',x:70,y:70,w:240,h:60,color:'#222222',size:28,bg:'transparent'},button:{text:'Click me',x:70,y:150,w:170,h:48,color:'#ffffff',size:16,bg:'#0078d7'},image:{text:'',x:70,y:230,w:180,h:130,color:'#222222',size:16,bg:'#eeeeee',src:''},tile:{text:'New tile',x:290,y:70,w:180,h:130,color:'#ffffff',size:22,bg:'#0078d7'}};
function say(s){status.textContent=s}function add(kind,extra={}){const d={...defaults[kind],...extra,id:nextId++,kind};items.push(d);selected=d.id;render();say(kind+' added');if(kind==='image'&&!d.src)document.querySelector('#imageFile').click()}
function render(){canvas.innerHTML='';for(const d of items){const el=document.createElement('div');el.className='element'+(selected===d.id?' selected':'');el.dataset.id=d.id;style(el,d);if(d.kind==='image'){if(d.src){const im=document.createElement('img');im.src=d.src;im.alt='Project image';el.append(im)}else el.textContent='Choose image…'}else if(d.kind==='button'){const b=document.createElement('button');b.textContent=d.text;el.append(b)}else el.textContent=d.text;el.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();selected=d.id;drag={id:d.id,ox:e.clientX-d.x,oy:e.clientY-d.y};renderInspector()});el.addEventListener('click',e=>{e.stopPropagation();selected=d.id;render()});canvas.append(el)}renderInspector()}
function style(el,d){Object.assign(el.style,{left:d.x+'px',top:d.y+'px',width:d.w+'px',height:d.h+'px',color:d.color,fontSize:d.size+'px',background:d.bg})}
function renderInspector(){const d=items.find(x=>x.id===selected);if(!d){inspector.innerHTML='<p class="empty">Select an item on the canvas to edit it.</p>';return}inspector.replaceChildren();for(const [label,key,type] of [['Text','text','text'],['X position','x','number'],['Y position','y','number'],['Width','w','number'],['Height','h','number'],['Text size','size','number'],['Text color','color','color'],['Background','bg',d.bg==='transparent'?'text':'color']]){const wrap=document.createElement('div');wrap.className='field';const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.type=type;i.value=d[key]??'';i.addEventListener('input',()=>{d[key]=type==='number'?Number(i.value):i.value;const el=canvas.querySelector(`[data-id="${d.id}"]`);if(el){style(el,d);if(d.kind==='button')el.firstChild.textContent=d.text;else if(d.kind!=='image')el.textContent=d.text}});wrap.append(l,i);inspector.append(wrap)}const del=document.createElement('button');del.textContent='Delete component';del.style.cssText='width:100%;background:#b3261e';del.onclick=()=>{items=items.filter(x=>x.id!==selected);selected=null;render();say('Component deleted')};inspector.append(del)}
window.addEventListener('pointermove',e=>{if(!drag)return;const d=items.find(x=>x.id===drag.id);if(!d)return;const r=canvas.getBoundingClientRect();d.x=Math.max(0,Math.round(e.clientX-r.left-drag.ox));d.y=Math.max(0,Math.round(e.clientY-r.top-drag.oy));const el=canvas.querySelector(`[data-id="${d.id}"]`);if(el){el.style.left=d.x+'px';el.style.top=d.y+'px'}});window.addEventListener('pointerup',()=>{if(drag){drag=null;renderInspector()}});
document.querySelectorAll('.tool').forEach(t=>t.onclick=()=>add(t.dataset.kind));document.querySelector('#addText').onclick=()=>add('text');document.querySelector('#clear').onclick=()=>{if(confirm('Clear all components?')){items=[];selected=null;render();say('Canvas cleared')}};
document.querySelector('#save').onclick=()=>{const p={format:'tileforge',version:1,elements:items};download(JSON.stringify(p,null,2),'project.tileforge','application/json');say('Project saved')};document.querySelector('#open').onclick=()=>document.querySelector('#fileOpen').click();document.querySelector('#fileOpen').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(p.format!=='tileforge'||!Array.isArray(p.elements))throw Error('Not a TileForge project');items=p.elements;nextId=Math.max(0,...items.map(x=>x.id||0))+1;selected=null;render();say('Project opened')}catch(err){alert('Could not open project: '+err.message)}e.target.value=''};
document.querySelector('#imageFile').onchange=async e=>{const f=e.target.files[0],d=items.find(x=>x.id===selected);if(f&&d&&d.kind==='image'){d.src=await dataUrl(f);render();say('Image added')}e.target.value=''};
document.querySelector('#preview').onclick=()=>{const body=items.map(d=>{const s=`position:absolute;left:${d.x}px;top:${d.y}px;width:${d.w}px;height:${d.h}px;color:${d.color};font-size:${d.size}px;background:${d.bg};padding:5px;overflow:hidden;`;if(d.kind==='image')return d.src?`<img src="${d.src}" style="${s}object-fit:contain">`:'';if(d.kind==='button')return `<button style="${s}">${esc(d.text)}</button>`;return `<div style="${s}">${esc(d.text)}</div>`}).join('\n');download(`<!doctype html><html><head><meta charset="utf-8"><title>TileForge Preview</title></head><body style="margin:0;font-family:Segoe UI,Arial"><main style="position:relative;width:${canvas.clientWidth}px;height:${canvas.clientHeight}px;background:white">${body}</main></body></html>`,'tileforge-preview.html','text/html');say('HTML preview exported')};canvas.addEventListener('click',e=>{if(e.target===canvas){selected=null;render()}});
function download(content,name,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function dataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}add('text',{text:'Welcome to TileForge',x:50,y:45,w:390,h:55,size:30,color:'#0078d7'});add('tile',{text:'Your first Metro tile',x:50,y:125,w:220,h:145})})();
</script></body></html>
